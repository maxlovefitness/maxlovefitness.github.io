.offer li b{color:#fff}
.offer li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:8px;margin-left:4px}

.pricebox p{font-size:14px;color:#C7CBD0;margin-top:8px}
.honest{border-left:3px solid var(--red);padding:12px 16px;background:#1E2126;border-radius:0 10px 10px 0;font-size:14.5px;color:#C7CBD0;margin-top:16px}
.honest b{color:#fff}
details.faq{border-bottom:1px solid var(--rule);padding:14px 0}
details.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"+";font-family:"JetBrains Mono",monospace;color:var(--ink3)}
details.faq[open] summary:after{content:"–"}
details.faq p{margin-top:10px;color:var(--ink2);font-size:15.5px;max-width:60ch}

<script>
document.documentElement.classList.add("js");
(function(){
  var h=document.querySelector(".hdr"); if(h){ var f=function(){h.classList.toggle("stuck",window.scrollY>8)}; f(); addEventListener("scroll",f,{passive:true}); }
  var els=[].slice.call(document.querySelectorAll(".rv"));
  if(!("IntersectionObserver" in window)){ els.forEach(function(e){e.classList.add("in")}); return; }
  var io=new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }); },{rootMargin:"0px 0px -8% 0px",threshold:.08});
  els.forEach(function(e){io.observe(e)});
  // count-up
  var cs=[].slice.call(document.querySelectorAll("[data-count]"));
  var co=new IntersectionObserver(function(en){ en.forEach(function(x){ if(!x.isIntersecting) return; co.unobserve(x.target);
    var el=x.target, end=+el.getAttribute("data-count"), pre=el.getAttribute("data-pre")||"", t0=null;
    if(matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=pre+end; return; }
    var step=function(t){ if(!t0)t0=t; var p=Math.min(1,(t-t0)/900); var v=Math.round(end*(1-Math.pow(1-p,3))); el.textContent=pre+v; if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); }); },{threshold:.5});
  cs.forEach(function(e){co.observe(e)});
})();
</script>
