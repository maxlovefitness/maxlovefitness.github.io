<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>thumb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Caveat:wght@600&display=swap">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#EEEBE6;font-family:Inter,sans-serif}
.face{position:absolute;left:0;top:0;width:560px;height:720px;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.face:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 78%,#EEEBE6 100%)}
.title{position:absolute;left:520px;top:64px;width:720px;font-size:88px;font-weight:900;letter-spacing:-.045em;line-height:.95;color:#16181C}
.title mark{background:none;color:#B4253A}
.doc{position:absolute;left:600px;top:280px;width:600px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.18);padding:26px 34px 30px 60px;box-sizing:border-box}
.doc h4{margin:0 0 12px;font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:#8A9099;font-weight:800}
.doc ul{list-style:none;margin:0;padding:0;columns:2;column-gap:44px}
.doc li{font-family:Caveat,cursive;font-size:40px;line-height:1.22;white-space:nowrap;color:#16181C;position:relative;padding-left:6px}
.doc li.x{color:#B7BCC2;text-decoration:line-through;text-decoration-color:#B4253A;text-decoration-thickness:4px}
.doc li.keep{color:#16181C;font-weight:600}
.doc li.keep:before{content:"✓";position:absolute;left:-26px;color:#B4253A;font-family:Inter,sans-serif;font-weight:900;font-size:26px;top:6px}
.tag{position:absolute;right:40px;bottom:18px;font-size:22px;font-weight:800;letter-spacing:.02em;color:#8A9099}
</style></head><body>
<div class="face"><img src="../hero.jpg" alt=""></div>
<div class="title">stop adding<br><mark>exercises.</mark></div>
<div class="doc"><h4>my workout</h4><ul>
<li class="keep">weighted pull-up</li><li class="keep">weighted dip</li><li class="x">cable fly</li><li class="x">face pulls</li><li class="x">decline press</li><li class="x">shrugs</li><li class="x">pec deck</li><li class="x">kickbacks</li><li class="x">rear delts</li><li class="x">upright row</li>
</ul></div>
<div class="tag">maxlovefitness.com</div>
</body></html>
