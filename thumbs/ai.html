<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>thumb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@600&display=swap">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#EEEBE6;font-family:Inter,sans-serif}
.face{position:absolute;left:0;top:0;width:560px;height:720px;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.face:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 78%,#EEEBE6 100%)}
.title{position:absolute;left:520px;top:58px;width:740px;font-size:80px;font-weight:900;letter-spacing:-.045em;line-height:.95;color:#16181C}
.title mark{background:none;color:#B4253A}
.chat{position:absolute;left:600px;top:272px;width:610px;background:#16181C;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);padding:26px 28px;box-sizing:border-box;color:#E8EAED;font-family:"JetBrains Mono",monospace}
.row{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.who{font-size:13px;letter-spacing:.16em;color:#8A9099;width:44px;padding-top:6px;flex:none}
.msg{font-size:27px;line-height:1.3;white-space:nowrap}
.me .msg{color:#fff;font-weight:600}
.it .msg{color:#C7CBD0;font-size:22px}
.it .msg b{color:#fff}
.it .msg .up{color:#F28B9A;font-weight:600}
.tag{position:absolute;right:40px;bottom:18px;font-size:22px;font-weight:800;color:#8A9099}
</style></head><body>
<div class="face"><img src="../about.jpg" alt=""></div>
<div class="title">your ai is<br>your <mark>logger.</mark></div>
<div class="chat">
<div class="row me"><div class="who">YOU</div><div class="msg">pull 20x8,8</div></div>
<div class="row it"><div class="who">IT</div><div class="msg"><span class="up">Up.</span> Both sets at 8.<br><b>Next: 25 lb, 5 reps both sets.</b></div></div>
<div class="row me"><div class="who">YOU</div><div class="msg">elbow felt off</div></div>
<div class="row it"><div class="who">IT</div><div class="msg">Holding 25 lb, one rep fewer,<br>until you say it's quiet.</div></div>
</div>
<div class="tag">maxlovefitness.com</div>
</body></html>
