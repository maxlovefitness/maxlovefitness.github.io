<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>thumb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Caveat:wght@600&display=swap">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#EEEBE6;font-family:Inter,sans-serif}
.face{position:absolute;left:0;top:0;width:560px;height:720px;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 42%}
.face:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 78%,#EEEBE6 100%)}
.title{position:absolute;left:520px;top:64px;width:740px;font-size:88px;font-weight:900;letter-spacing:-.045em;line-height:.95;color:#16181C}
.title mark{background:none;color:#B4253A}
.doc{position:absolute;left:600px;top:290px;width:600px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.18);padding:26px 34px 28px 34px;box-sizing:border-box}
.doc h4{margin:0 0 12px;font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:#8A9099;font-weight:800}
.doc ul{list-style:none;margin:0;padding:0}
.doc li{font-family:Caveat,cursive;font-size:40px;line-height:1.2;color:#16181C;display:grid;grid-template-columns:120px 1fr;column-gap:16px;align-items:baseline}
.doc li b{font-family:Inter,sans-serif;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#B4253A}
.doc li.rest span{color:#8A9099}
.tag{position:absolute;right:40px;bottom:18px;font-size:22px;font-weight:800;letter-spacing:.02em;color:#8A9099}
</style></head><body>
<div class="face"><img src="pool-lean.jpg" alt=""></div>
<div class="title">two workouts<br><mark>a week.</mark></div>
<div class="doc"><h4>my week</h4><ul>
<li><b>mon</b><span>pull day — weighted pull-up</span></li>
<li><b>thu</b><span>push day — weighted dip</span></li>
<li class="rest"><b>rest</b><span>eat right. walk. sleep.</span></li>
</ul></div>
<div class="tag">maxlovefitness.com</div>
</body></html>
