<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Your AI Is Your Logger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Single-theme, white, by intent: this is the right-hand document panel of a talking-head video,
     in the style of a Notion page — bold term, dash, one-line definition — with textbook graphs
     (thin black axes, one crimson curve, serif labels). Everything is for the viewer. */
  :root{
    --paper:#FFFFFF; --ink:#1F2328; --ink2:#4B5159; --ink3:#8A9099; --rule:#E6E8EB; --wash:#F6F7F8;
    --red:#B4253A; --red-soft:#F7D9DD; --hl:#FFE7A3; --hl-red:#F9C7CE;
    --u: clamp(10px, 1.05vw, 20px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);overflow:hidden;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
  :focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:2px}
  svg{display:block} img{display:block}

  .stage{position:fixed;inset:0}
  .page{position:absolute;inset:0;display:none;overflow:hidden;padding:calc(var(--u)*3.2) calc(var(--u)*8) calc(var(--u)*4) calc(var(--u)*10)}
  .page.on{display:block}
  .doc{max-width:calc(var(--u)*78);display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}

  .crumb{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.78);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  h1{font-size:calc(var(--u)*3.4);font-weight:800;letter-spacing:-.03em;line-height:1.08;text-wrap:balance;max-width:20ch}
  h2{font-size:calc(var(--u)*2.15);font-weight:700;letter-spacing:-.025em;line-height:1.15;text-wrap:balance;max-width:26ch}
  mark{background:linear-gradient(transparent 12%,var(--hl-red) 12%,var(--hl-red) 88%,transparent 88%);color:inherit;padding:0 .12em}
  mark.y{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%)}
  .lede{font-size:calc(var(--u)*1.28);line-height:1.5;color:var(--ink2);max-width:60ch}
  .quote{font-family:"EB Garamond",Georgia,serif;font-size:calc(var(--u)*1.75);line-height:1.35;max-width:46ch;border-left:3px solid var(--red);padding-left:calc(var(--u)*1.2);color:var(--ink)}
  .quote small{display:block;font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.74);letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-top:calc(var(--u)*.6)}

  /* the outline — Notion-style */
  ul.o{list-style:none;display:flex;flex-direction:column;gap:calc(var(--u)*.62);font-size:calc(var(--u)*1.12);line-height:1.5;color:var(--ink2)}
  ul.o li{padding-left:calc(var(--u)*1.5);position:relative}
  ul.o li::before{content:"•";position:absolute;left:calc(var(--u)*.3);color:var(--ink);font-weight:700}
  ul.o li b{color:var(--ink);font-weight:700}
  ul.o ul.o{margin-top:calc(var(--u)*.55);gap:calc(var(--u)*.45);font-size:calc(var(--u)*1.05)}
  ul.o ul.o li::before{content:"◦"}
  ul.o ul.o ul.o li::before{content:"▪";font-size:.7em;top:.35em}
  ul.o li.x b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--red)}
  ul.o li.x{color:var(--ink3)}
  ul.o li.pick{background:var(--wash);border-radius:calc(var(--u)*.3);padding-top:calc(var(--u)*.45);padding-bottom:calc(var(--u)*.45);padding-right:calc(var(--u)*.8)}
  ul.o li.clk{cursor:pointer}
  ul.o li.clk:hover b{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.4);align-items:start}
  .row.w{grid-template-columns:1.15fr .85fr}

  /* textbook graphs */
  figure.g{margin-top:calc(var(--u)*.6)}
  figure.g svg{width:100%;height:auto;overflow:visible}
  figure.g figcaption{font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:calc(var(--u)*1.02);color:var(--ink3);margin-top:calc(var(--u)*.5)}
  .ax{stroke:#1F2328;stroke-width:1.6}
  .curve{stroke:var(--red);stroke-width:2.6;fill:none;stroke-linecap:round}
  .curve.grey{stroke:#9AA0A8;stroke-dasharray:6 6}
  .serif{font-family:"EB Garamond",Georgia,serif;font-size:15px;fill:#1F2328}
  .serif.small{font-size:12.5px;fill:#6B727B}
  .mark{fill:#fff;stroke:var(--red);stroke-width:3;cursor:grab}
  .band{fill:#F6F7F8}
  .readout{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.9);letter-spacing:.02em;color:var(--ink2);margin-top:calc(var(--u)*.5);min-height:1.6em}
  .readout b{color:var(--red);font-weight:600}

  /* controls */
  .ctl{display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;align-items:center;margin-top:calc(var(--u)*.6)}
  .sw{min-width:16ch;flex:1 1 20%}
  .sw label{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.74);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);display:block}
  .sw output{font-weight:700;font-size:calc(var(--u)*1.25);font-variant-numeric:tabular-nums;display:block;margin-top:calc(var(--u)*.15)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--rule);border-radius:99px;outline:none;margin-top:calc(var(--u)*.7)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--red);cursor:grab}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--red);border:3px solid #fff;cursor:grab}
  .tog{display:inline-flex;border:1px solid var(--rule);border-radius:calc(var(--u)*.3);overflow:hidden}
  .tog button{padding:calc(var(--u)*.5) calc(var(--u)*1);font-size:calc(var(--u)*.92);font-weight:600;color:var(--ink2)}
  .tog button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .btn{border:1px solid var(--ink);padding:calc(var(--u)*.5) calc(var(--u)*1.1);border-radius:calc(var(--u)*.3);font-weight:600;font-size:calc(var(--u)*.92)}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}
  .btn.ghost{border-color:var(--rule);color:var(--ink2)}

  /* grids that teach */
  .cal{display:flex;gap:6px;flex-wrap:wrap}
  .wk{width:calc(var(--u)*3);height:calc(var(--u)*3);border:1px solid var(--rule);border-radius:4px;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.85);color:var(--ink3);transition:all .15s}
  .wk.done{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  .wk.gone{background:var(--wash);color:#C3C7CC}
  .streak{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;max-width:calc(var(--u)*46)}
  .sq{aspect-ratio:1;border-radius:3px;background:var(--red);transition:all .14s}
  .sq.miss{background:#fff;border:1.5px dashed #C3C7CC}
  .sq.dead{background:var(--red-soft);border:1.5px solid var(--red)}
  .verdict{font-weight:700;font-size:calc(var(--u)*1.2);min-height:1.5em}
  .verdict.ok{color:#2F6D4F}.verdict.no{color:var(--red)}
  .reps{display:flex;gap:6px;align-items:flex-end;height:calc(var(--u)*6);max-width:calc(var(--u)*40)}
  .rep{flex:1;background:var(--wash);border:1px solid var(--rule);border-radius:3px 3px 0 0;height:36%;transition:all .25s}
  .rep.hit{background:var(--red);border-color:var(--red);height:100%}
  .plates{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .plate{border:1.5px solid var(--ink);border-radius:999px;padding:calc(var(--u)*.55) calc(var(--u)*1.1);font-weight:700;font-variant-numeric:tabular-nums;font-size:calc(var(--u)*1)}
  .plate:hover{background:var(--wash)}
  .flag{font-weight:600;padding:calc(var(--u)*.35) calc(var(--u)*.8);border-radius:4px;font-size:calc(var(--u)*.95)}
  .flag.ok{background:#EAF3EE;color:#2F6D4F}.flag.no{background:var(--red-soft);color:var(--red)}
  .big{font-size:calc(var(--u)*3.2);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--red);line-height:1}
  table{border-collapse:collapse;font-size:calc(var(--u)*1);width:100%}
  th,td{text-align:left;padding:calc(var(--u)*.5) calc(var(--u)*.8);border-bottom:1px solid var(--rule)}
  th{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.72);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
  tr.hl td{background:var(--wash)} td.n{font-variant-numeric:tabular-nums;font-weight:600}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:calc(var(--u)*44)}
  .day{aspect-ratio:1;border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.74);color:var(--ink3);transition:all .15s}
  .day b{font-family:"Inter",sans-serif;font-size:calc(var(--u)*1);color:var(--ink)}
  .day.read{background:var(--red-soft);border-color:var(--red);color:var(--red)} .day.read b{color:var(--red)}

  /* photos */
  figure.ph{margin:0}
  figure.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:calc(var(--u)*.4);border:1px solid var(--rule)}
  figure.ph.tall img{aspect-ratio:3/4}
  figure.ph figcaption{font-family:"EB Garamond",Georgia,serif;font-style:italic;font-size:calc(var(--u)*1);color:var(--ink3);margin-top:calc(var(--u)*.45)}
  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1)}
  .open{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*3);align-items:center}
  .open img{height:calc(var(--u)*30);width:auto;border-radius:calc(var(--u)*.4);border:1px solid var(--rule)}
  .cred{display:flex;gap:calc(var(--u)*2.2);flex-wrap:wrap;margin-top:calc(var(--u)*.6)}
  .cred .k{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.72);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  .cred .v{font-size:calc(var(--u)*1.9);font-weight:800;letter-spacing:-.03em;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.05;margin-top:2px}
  .cred .v small{font-size:calc(var(--u)*.9);color:var(--ink2);font-weight:600;letter-spacing:0}

  /* menu + chrome */
  .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.4);margin-top:calc(var(--u)*1)}
  .mcard{border:1px solid var(--rule);border-radius:calc(var(--u)*.4);padding:calc(var(--u)*1.6);display:flex;flex-direction:column;gap:calc(var(--u)*.6);transition:all .18s}
  .mcard:hover{border-color:var(--red);background:var(--wash)}
  .mcard .n{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.74);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .mcard .t{font-size:calc(var(--u)*1.8);font-weight:800;letter-spacing:-.025em}
  .mcard p{font-size:calc(var(--u)*.98);color:var(--ink2);line-height:1.5}
  .hud{position:fixed;left:calc(var(--u)*2);bottom:calc(var(--u)*1.4);font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.78);letter-spacing:.1em;color:var(--ink3);display:flex;gap:calc(var(--u)*1.2)}
  .rail{position:fixed;left:0;bottom:0;height:3px;background:var(--red);width:0;transition:width .24s}
  .hint{position:fixed;right:calc(var(--u)*2);bottom:calc(var(--u)*1.4);font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.74);letter-spacing:.1em;color:#C3C7CC;text-transform:uppercase}
  body.clean .hud,body.clean .hint{opacity:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
  .flow{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.2)}
  .q{border:1px solid var(--rule);border-radius:8px;padding:calc(var(--u)*1.2)}
  .q h3{font-size:calc(var(--u)*1.05);font-weight:700;margin-bottom:calc(var(--u)*.6)}
  .q .tog{margin-top:calc(var(--u)*.2)}
  .ans{margin-top:calc(var(--u)*1);padding:calc(var(--u)*1.2);border-left:3px solid var(--red);background:var(--wash);font-size:calc(var(--u)*1.15);font-weight:600;min-height:calc(var(--u)*3)}
  .tl{border-collapse:collapse;width:100%;font-size:calc(var(--u)*1)}
  .tl td{padding:calc(var(--u)*.5) calc(var(--u)*.8);border-bottom:1px solid var(--rule);vertical-align:top}
  .tl td.t{font-family:"JetBrains Mono",monospace;color:var(--red);white-space:nowrap;font-weight:600;width:8ch}
  .fig2{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.2);align-items:end}
  .fig2 figure{margin:0;text-align:center}.fig2 svg{width:100%;height:auto}
  .fig2 figcaption{font-family:"EB Garamond",Georgia,serif;font-style:italic;color:var(--ink3);font-size:calc(var(--u)*1)}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.2)}
  .kv div{border-top:2px solid var(--ink);padding-top:calc(var(--u)*.7)}
  .kv .k{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.72);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  .kv .v{font-size:calc(var(--u)*1.1);line-height:1.45;margin-top:calc(var(--u)*.35);color:var(--ink2)}
  .kv .v b{color:var(--ink)}
  .pile{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.45);margin:calc(var(--u)*.8) 0}
  .pile span{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.78);padding:calc(var(--u)*.3) calc(var(--u)*.6);border:1px solid var(--rule);border-radius:5px;color:var(--ink3);transition:.15s}
  .pile span.on{border-color:var(--ink);color:var(--ink);background:#fff}
  .pile span.core{border-color:var(--red);color:var(--red);font-weight:700}
  .meter{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*.7);align-items:center;margin:calc(var(--u)*.5) 0}
  .meter .k{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.72);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
  .meter .track{height:calc(var(--u)*.75);background:var(--wash);border-radius:99px;overflow:hidden}
  .meter .fill{height:100%;background:var(--red);width:0;transition:width .25s}
  .meter .fill.grey{background:#C3C7CC}
  .meter .v{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.85);font-weight:700;min-width:7ch;text-align:right}
  .log{border-collapse:collapse;width:100%;font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.85)}
  .log th{text-align:left;font-size:calc(var(--u)*.66);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--ink);padding:calc(var(--u)*.35) calc(var(--u)*.5)}
  .log td{padding:calc(var(--u)*.42) calc(var(--u)*.5);border-bottom:1px solid var(--rule)}
  .log tr.new td{background:#FDF3F4}
  .log td.up{color:var(--red);font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.6)}
  .two h3{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u)*.75);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:calc(var(--u)*.5)}
  .two ol{padding-left:calc(var(--u)*1.4);font-size:calc(var(--u)*1.05);line-height:1.55}
  .two ol li{margin-bottom:calc(var(--u)*.35)}
  .two ol li:first-child{font-weight:700}
  .scroller{overflow-x:auto}
  code{font-family:"JetBrains Mono",monospace;font-size:.9em;background:var(--wash);padding:1px 6px;border-radius:5px}
  .ctl .btn.ghost{font-size:calc(var(--u)*.85)}
  /* phone: stack every page into one scrolling document */
  @media (max-width:760px){
    :root{--u:clamp(11px,3.4vw,15px)}
    html,body{height:auto;overflow:auto}
    .stage{position:static;inset:auto}
    .page{position:static;display:block!important;overflow:visible;min-height:0;padding:calc(var(--u)*2.4) calc(var(--u)*1.6) calc(var(--u)*2.8);border-top:1px solid var(--rule)}
    .page:first-child{border-top:0}
    .open,.row,.row.w,.strip,.flow,.fig2,.kv{grid-template-columns:1fr}
    .open img{max-width:62%;justify-self:start}
    .doc{max-width:none}
    .hint,#num{display:none}
    .hud{background:rgba(255,255,255,.92);padding:calc(var(--u)*.5) calc(var(--u)*1);left:0;bottom:0;right:0;border-top:1px solid var(--rule)}
    rect[id$="Hit"]{touch-action:none}
    table{display:block;overflow-x:auto}
  }
</style>
</head><body><div class="stage" id="stage"></div>
<div class="rail" id="rail"></div>
<div class="hud"><span id="num">—</span><span id="label"></span></div>
<div class="hint">← → · h</div>

const W=640,H=300,PL=54,PR=40,PT=28,PB=44;                  // viewBox + padding
const X=t=>PL+t*(W-PL-PR), Y=v=>H-PB-v*(H-PT-PB);           // t,v in 0..1

  <text class="serif" x="${W-PR+14}" y="${H-PB+22}" text-anchor="end">${xl}</text><text class="serif" x="${PL-8}" y="${PT-14}" text-anchor="end">${yl}</text>`;

const label=(t,v,text,anchor="middle",dy=-10,cls="serif")=>`<text class="${cls}" x="${X(t)}" y="${Y(v)+dy}" text-anchor="${anchor}">${text}</text>`;

/* curves used by the decks */
const novelty = t => 0.95*Math.exp(-t*3.2)+0.05;                 // excitement of a new plan
const effort  = t => 0.22+0.5*(1-Math.exp(-t*2.2));               // what the plan actually asks of you
const restart = t => { const p=(t*8)%3; return 0.95*Math.exp(-(p/8)*3.2*3)+0.05; }; // sawtooth every 3 weeks
const bwOnly  = t => 0.15+0.55*(1-Math.exp(-t*4.5));
const weighted= t => t<0.22 ? bwOnly(t) : bwOnly(0.22)+0.55*(t-0.22)/0.78+0.08*Math.sin(t*9);
const climb   = t => 1-Math.exp(-t*2.4);                          // approaches "enough" but never arrives
const repsFor = pct => Math.max(1,Math.round(37*(1-pct)+1));      // rough load→reps table (Epley-ish)

 {label:"",html:`<div class="open">${maxImg()}<div class="doc">
   <div class="crumb">Max Love · training</div>
   <h1>Your AI is a better <mark>logger</mark> than your app.</h1>

 {label:"Store vs decide",html:`<div class="doc">
   <h1>An app stores. A log decides.</h1>
   <p class="lede">Four jobs a training record has to do. Most apps stop at the first one.</p>
   <div class="two">
     <div><h3>What an app does</h3><ol><li>Stores the number you typed</li><li>Shows you a chart of it</li><li>Sends you a streak notification</li><li>Charges you $12 a month</li></ol></div>
     <div><h3>What a log has to do</h3><ol><li>Store — weight and reps, both sets</li><li>Compare — to the last time you did that lift</li><li>Decide — same weight, or add five</li><li>Warn — three flat sessions, a sore joint, two misses in a row</li></ol></div>
   </div>
   <ul class="o" style="margin-top:calc(var(--u)*1.2)">
     <li><b>The gap</b> — Steps two to four are the whole point. An app leaves them to you, at the bar, tired, guessing. That's how people repeat the same weight for a year and never notice.</li>
     <li><b>What a chat does differently</b> — You give it the rule once. Then it applies the rule every session and answers back. The decision stops being yours to remember.</li>
   </ul></div>`},

 {label:"Setup",html:`<div class="doc">
   <h1>Thirty seconds to set up. Then never again.</h1>
   <div class="row">
   <ul class="o">
     <li><b>1 · Open two new chats</b> — ChatGPT or Claude, either works. Name one Training and one Food.</li>
     <li><b>2 · Paste one prompt into each</b> — With your bodyweight, your targets and your starting loads already filled in. It replies &ldquo;log ready&rdquo; and waits.</li>
     <li><b>3 · Never start a third chat</b> — The entire value is that it remembers what you lifted last time. A new chat is a new stranger.</li>
     <li><b>Then</b> — After every session, four characters and a number. That's it for the next year.</li>
   </ul>
   ${photo("phone","Same chat, every session, for a year.")}
   </div></div>`},

 {label:"The prompt",html:`<div class="doc">
   <h1>What's actually in the prompt</h1>
   <p class="lede">Six blocks. Each one does a job an app can't.</p>
   <ul class="o" id="promptList">
     <li class="clk"><b>My setup</b> — Bodyweight, calorie and protein targets, days a week, the two lifts that open each day, current loads.
       <ul class="o" hidden><li><b>Why</b> — So it never asks you the basics again, and so every decision it makes is relative to your numbers, not a generic table.</li></ul></li>
     <li class="clk"><b>How I'll talk to you</b> — A shorthand: <code>pull 20x8,7</code>, <code>dip 30x6,5</code>, <code>bw 177.2</code>, <code>skipped</code>.
       <ul class="o" hidden><li><b>Why</b> — Logging dies from friction. Four characters and a number is less effort than opening an app, and it works from a lock screen.</li></ul></li>
     <li class="clk"><b>The progression rule</b> — Both sets hit eight, add five pounds and reset to five. Anything else, same weight. Never add weight to fix a stall.
       <ul class="o" hidden><li><b>Why</b> — This is the whole program, stated once. The chat applies it for you, so you never argue with yourself about whether today counts.</li></ul></li>
     <li class="clk"><b>Every time I send a session</b> — Reprint the full table, one line comparing to last time, one line with the next target. Nothing else.
       <ul class="o" hidden><li><b>Why</b> — Reprinting the whole table means the log is never lost in scroll-back. &ldquo;Nothing else&rdquo; stops it from turning into a motivational speaker.</li></ul></li>
     <li class="clk"><b>Things to tell me unprompted</b> — Three flat sessions, any pain, two misses in a row, coming back from a layoff.
       <ul class="o" hidden><li><b>Why</b> — These are the four moments people get wrong on their own. It watches for them so you don't have to notice.</li></ul></li>
     <li class="clk"><b>Hard rules</b> — Never invent a number. One line, never a paragraph. No motivation, no emoji. If I ask to change the program, repeat the rule and ask what problem I'm solving.
       <ul class="o" hidden><li><b>Why</b> — The last one is the sneaky one. It's a guard against program-hopping, which is how most plans actually end.</li></ul></li>
   </ul></div>`},

 {label:"Live",html:`<div class="doc">
   <h1>Four characters in. A decision back.</h1>
   <div class="row w"><div>
   <div class="ctl" style="flex-wrap:wrap;gap:calc(var(--u)*.5)">
     <button class="btn ghost" data-send="pull 20x7,6">pull 20x7,6</button>
     <button class="btn ghost" data-send="pull 20x8,7">pull 20x8,7</button>
     <button class="btn red" data-send="pull 20x8,8">pull 20x8,8</button>
     <button class="btn ghost" data-send="pull 25x5,5">pull 25x5,5</button>
     <button class="btn ghost" data-send="elbow">elbow felt off</button>
     <button class="btn ghost" data-send="reset">start over</button>
   </div>
   <table class="log" style="margin-top:calc(var(--u)*.9)"><thead><tr><th>Session</th><th>Lift</th><th>Wt</th><th>S1</th><th>S2</th></tr></thead><tbody id="liveBody"></tbody></table>
   <p class="readout" id="liveOut">Send a session.</p>
   </div>
   <ul class="o">
     <li><b>What you typed</b> — The lift, the weight, both sets. Nothing else.</li>
     <li><b>What came back</b> — The whole table again, one line on whether you progressed, one line on what to do next. Same shape every time, so you never have to read.</li>
     <li><b>Notice</b> — The decision is the same one you'd make with a calculator and a clear head. The point is you never have to have the clear head at the bar.</li>
   </ul></div></div>`},

     <button class="btn ghost" data-food="yogurt">greek yogurt</button>

     <button class="btn ghost" data-food="reset">new day</button>
   </div>
   <div class="meter" style="margin-top:calc(var(--u)*1)"><div class="k">Calories</div><div class="track"><div class="fill grey" id="fCal"></div></div><div class="v" id="fCalV">0 / 2,000</div></div>
   <div class="meter"><div class="k">Protein</div><div class="track"><div class="fill" id="fPro"></div></div><div class="v" id="fProV">0 / 144 g</div></div>

   </div>

     <li><b>The one rule it's forbidden to break</b> — It never comments on whether a food is healthy, clean, or a good choice. Macros over food choices. That's the line that stops it turning into every nagging diet app you've deleted.</li>

 {label:"The average",html:`<div class="doc">
   <h1>One morning lies. Seven mornings tell the truth.</h1>
   <div class="row w"><div>
   <figure class="g"><svg viewBox="0 0 ${W} ${H}">${axes("days","bodyweight, lb")}<g id="gWtDots"></g><g id="gWtLine"></g><g id="gWtMark"></g>
     <rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="${H-PT-PB}" fill="transparent" id="gWtHit" style="cursor:crosshair"/></svg>
   <figcaption>Grey dots: what the scale said each morning. Red line: the seven-day average. Only one of them is information.</figcaption></figure>
   <p class="readout" id="wtOut">Drag across the chart.</p>
   </div>
   <ul class="o">
     <li><b>Why the daily number lies</b> — Salt, a late meal, a hard session, how much water you drank. A morning can swing two pounds and mean nothing.</li>
     <li><b>What the log does</b> — You send <code>bw 177.2</code>. It keeps the average and tells you the change from last week's average. Every Sunday, four lines: average, change, protein, sessions.</li>
     <li><b>Why it matters</b> — People quit cuts because of one bad morning on the scale. The average makes that impossible to misread.</li>
   </ul></div></div>`},

 {label:"Where it stops",html:`<div class="doc">
   <h1>It logs. It doesn't coach.</h1>
   <ul class="o">
     <li><b>It can't see you</b> — It has no idea whether your chin cleared the bar or your legs kicked. It'll happily record a rep that didn't count. The standard is still yours to hold.</li>
     <li><b>It knows you stalled, not why</b> — Three flat sessions has at least three causes with opposite fixes: the joints, recovery, or a long deficit. It asks. It can't tell.</li>
     <li><b>It doesn't care if you show up</b> — That has never been an information problem, and it's the one most people actually have.</li>
     <li><b>So</b> — The chat is the notebook that talks back. It replaces the app. It doesn't replace the person who knows which of the three stalls is yours.</li>
   </ul></div>`},

function wireExtra(){
  // prompt blocks
  const pl=$("promptList"); if(pl) pl.onclick=e=>{ const li=e.target.closest("li.clk"); if(!li) return; const sub=li.querySelector("ul"); if(sub){ sub.hidden=!sub.hidden; li.classList.toggle("pick",!sub.hidden);} };

  // live training simulator
  const lb=$("liveBody");
  if(lb){ let rows=[]; let hurt=false;
    const draw=(msg)=>{ lb.innerHTML=rows.map((r,i)=>`<tr class="${i===rows.length-1?"new":""}"><td>${i+1}</td><td>${r.lift}</td><td class="${r.up?"up":""}">${r.w} lb${r.up?" ▲":""}</td><td>${r.a}</td><td>${r.b}</td></tr>`).join(""); $("liveOut").innerHTML=msg; };
    document.querySelectorAll("[data-send]").forEach(b=>b.onclick=()=>{ const s=b.dataset.send;
      if(s==="reset"){ rows=[]; hurt=false; draw("Log cleared. Send a session."); return; }
      if(s==="elbow"){ hurt=true; draw(`<b>Holding you at ${rows.length?rows[rows.length-1].w:20} lb</b> and stopping each set one rep earlier. No progression until you tell me it's quiet.`); return; }
      const m=s.match(/^(\w+)\s+(\d+)x(\d+),(\d+)$/); if(!m) return; const [_,lift,w,a,b2]=m; const W_=+w,A=+a,B=+b2;
      const prev=[...rows].reverse().find(r=>r.lift===lift); const up=prev&&W_>prev.w;
      rows.push({lift,w:W_,a:A,b:B,up});
      let cmp = !prev ? "First time logging this lift." : (W_>prev.w ? `<b>Up.</b> New weight.` : (A+B>prev.a+prev.b ? `<b>Up.</b> ${A}/${B} vs ${prev.a}/${prev.b} last time.` : (A+B===prev.a+prev.b ? `<b>Held.</b> Same as last time.` : `<b>Down.</b> ${A}/${B} vs ${prev.a}/${prev.b}.`)));
      let next;
      if(hurt) next=`Holding ${W_} lb until the elbow is quiet.`;
      else if(A>=8&&B>=8) next=`<b>Next pull day: ${W_+5} lb, target 5 reps both sets.</b>`;
      else next=`Next pull day: ${W_} lb again. Not eight on both yet.`;
      const flat = rows.filter(r=>r.lift===lift).slice(-3); const stall = flat.length===3 && flat.every(r=>r.w===flat[0].w&&r.a===flat[0].a&&r.b===flat[0].b);
      draw(cmp+" "+next+(stall?`<br><b>That's three sessions at the same numbers.</b> How are you sleeping, are you in a deficit, does anything ache?`:"")); });
    draw("Send a session."); }

  // food demo
  const fc=$("fCal");
  if(fc){ const items={ribeye:["Ribeye, 8 oz",640,56],eggs:["Eggs, 3",215,19],chipotle:["Chipotle bowl (est)",890,62],yogurt:["Greek yogurt, 200 g",130,20],shake:["Whey, 1 scoop",120,25]};
    let cal=0,pro=0,lines=[]; const CAL=2000,PRO=144;
    const paint=(last)=>{ fc.style.width=Math.min(100,cal/CAL*100)+"%"; $("fCalV").textContent=`${cal.toLocaleString()} / ${CAL.toLocaleString()}`; $("fPro").style.width=Math.min(100,pro/PRO*100)+"%"; $("fProV").textContent=`${pro} / ${PRO} g`;
      $("foodOut").innerHTML = last ? `${last[0]} — ${last[1]} kcal, ${last[2]} g<br><b>Today: ${cal.toLocaleString()} kcal, ${pro} g protein</b><br>Left: ${Math.max(0,CAL-cal).toLocaleString()} kcal, ${Math.max(0,PRO-pro)} g protein${cal>CAL?` · over by ${(cal-CAL).toLocaleString()}`:""}` : "Nothing logged yet today."; };
    document.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{ const k=b.dataset.food; if(k==="reset"){cal=0;pro=0;lines=[];paint(null);return;} const it=items[k]; cal+=it[1]; pro+=it[2]; paint(it); });
    paint(null); }

  // weekly average graph
  const hit=$("gWtHit");
  if(hit){ const N=28; const seed=[0.9,-0.4,1.3,-1.1,0.2,0.8,-0.9,0.5,1.1,-1.3,0.3,-0.6,1.0,-0.2,0.7,-1.2,0.4,0.9,-0.8,0.1,1.2,-1.0,0.6,-0.3,0.8,-1.1,0.2,0.5];
    const daily=Array.from({length:N},(_,i)=>180-2.6*(i/(N-1))+seed[i]); const avg=daily.map((_,i)=>{const s=daily.slice(Math.max(0,i-6),i+1); return s.reduce((a,b)=>a+b,0)/s.length;});
    const lo=176, hi=182; const yv=v=>Y((v-lo)/(hi-lo));
    $("gWtDots").innerHTML=daily.map((v,i)=>`<circle cx="${X(i/(N-1))}" cy="${yv(v)}" r="3.2" fill="#C3C7CC"/>`).join("");
    $("gWtLine").innerHTML=`<path class="curve" d="${avg.map((v,i)=>`${i?"L":"M"}${X(i/(N-1))} ${yv(v)}`).join(" ")}"/>`;
    drag("gWtHit", t=>{ const i=Math.round(t*(N-1)); $("gWtMark").innerHTML=`<line x1="${X(i/(N-1))}" y1="${PT}" x2="${X(i/(N-1))}" y2="${H-PB}" stroke="#B4253A" stroke-dasharray="3 5"/><circle cx="${X(i/(N-1))}" cy="${yv(daily[i])}" r="6" fill="#fff" stroke="#8A9099" stroke-width="2"/><circle class="mark" cx="${X(i/(N-1))}" cy="${yv(avg[i])}" r="7"/>`;
      const d=daily[i]-(i?daily[i-1]:daily[i]); $("wtOut").innerHTML=`<b>Day ${i+1}.</b> Scale said ${daily[i].toFixed(1)} (${d>=0?"+":""}${d.toFixed(1)} overnight). Seven-day average: ${avg[i].toFixed(1)}. ${Math.abs(d)>0.8?"That overnight swing is water and salt, not fat. The average didn't flinch.":"Quiet morning. The average is what moved."}`; }); }
}
/* ============================ ENGINE ============================ */
const stage=document.getElementById("stage"), rail=document.getElementById("rail"), numEl=document.getElementById("num"), labEl=document.getElementById("label");
let deck=null, i=0; const $=id=>document.getElementById(id);
const MENU=`<section class="page on"><div class="doc">
  <div class="crumb">Max Love</div><h1>Three things worth learning</h1>
  <div class="menu">
    <button class="mcard" data-deck="lock"><span class="n">01 · 9 pages</span><span class="t">Lock In</span><p>Why every plan dies in week three, the only number that matters, the one rule that keeps it alive.</p></button>
    <button class="mcard" data-deck="weight"><span class="n">02 · 9 pages</span><span class="t">Load Up</span><p>Weighted calisthenics from the first ten pounds: the test, the gear, load and reps, the eight-week block.</p></button>
    <button class="mcard" data-deck="christ"><span class="n">03 · 8 pages</span><span class="t">Look Up</span><p>Who Jesus said He is, what the cross was in plain words, how to start if you never have.</p></button>
  </div></div></section>`;
function showMenu(){ deck=null; stage.innerHTML=MENU; stage.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>openDeck(b.dataset.deck)); numEl.textContent="—"; labEl.textContent=""; rail.style.width="0"; }
function openDeck(k){ deck=k; i=0; stage.innerHTML=DECKS[k].pages.map(p=>`<section class="page">${p.html}</section>`).join(""); wire(); render(); }
function render(){ const p=DECKS[deck].pages; stage.querySelectorAll(".page").forEach((el,k)=>el.classList.toggle("on",k===i));
  numEl.textContent=`${String(i+1).padStart(2,"0")} / ${String(p.length).padStart(2,"0")}`; labEl.textContent=DECKS[deck].name+(p[i].label?" · "+p[i].label:""); rail.style.width=((i+1)/p.length*100)+"%"; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){i=0;render();return;} if(e.key.toLowerCase()==="h"){document.body.classList.toggle("clean");return;} if(!deck)return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){ if(i<DECKS[deck].pages.length-1){i++;render();} } if(e.key==="ArrowLeft"||e.key==="PageUp"){ if(i>0){i--;render();} } });

/* drag helper: maps pointer x on an svg hit-rect to t in 0..1 */
function drag(hitId, onT){ const hit=$(hitId); if(!hit) return; const svg=hit.ownerSVGElement;
  const tOf=e=>{ const r=svg.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W; return Math.max(0,Math.min(1,(x-PL)/(W-PL-PR))); };
  let down=false; hit.addEventListener("pointerdown",e=>{down=true;onT(tOf(e));}); hit.addEventListener("pointermove",e=>{ if(down||e.buttons) onT(tOf(e)); }); window.addEventListener("pointerup",()=>down=false); }

function wire(){ if(deck==="lock") wireLock(); if(deck==="weight") wireWeight(); if(deck==="christ") wireChrist(); wireExtra(); }

function wireLock(){
  // novelty vs effort
  drag("gNovHit", t=>{ const g=$("gNovMark"); const n=novelty(t), e=effort(t), wk=(t*8).toFixed(1);
    g.innerHTML=`<line x1="${X(t)}" y1="${PT}" x2="${X(t)}" y2="${H-PB}" stroke="#B4253A" stroke-dasharray="3 5"/><circle class="mark" cx="${X(t)}" cy="${Y(n)}" r="7"/>`;
    $("novOut").innerHTML=`<b>Week ${wk}</b> — novelty ${Math.round(n*100)}%, effort ${Math.round(e*100)}%. `+(n>e?"Still riding the new-plan high.":t<0.5?"Novelty is gone and the plan finally costs something. This is where most people restart.":"Past the quit zone. It stopped being a plan and became what you do."); });
  // sessions
  const spw=$("spw"), wks=$("wks");
  if(spw){ const upd=()=>{ const a=+spw.value,b=+wks.value,t=a*b; $("spwV").textContent=a; $("wksV").textContent=b; $("totV").textContent=t;
      const maxY=Math.max(48,t); let d="",dp=""; for(let w=0;w<=16;w++){ const x=X(w/16); const y=Y(Math.min(w,b)*a/maxY); d+=(w?"L":"M")+x+" "+y+" "; const yp=Y(Math.min(w*3,9)/maxY); dp+=(w?"L":"M")+x+" "+yp+" "; }
      $("gSessLine").setAttribute("d",d); $("gSessPerfect").setAttribute("d",dp); $("gSessDot").setAttribute("cx",X(b/16)); $("gSessDot").setAttribute("cy",Y(t/maxY));
      const cross= a>0? Math.ceil(24/a):null; $("sessOut").innerHTML= t>=24?`<b>${t} sessions.</b> You cross the visible-change line in week ${cross}. After that it compounds.`:`<b>${t} sessions.</b> Not there yet — at ${a} a week you'd cross it in week ${cross}. Keep going.`; };
    spw.oninput=upd; wks.oninput=upd; upd(); }
  const mL=$("metricList"); if(mL) mL.onclick=e=>{ const li=e.target.closest("li.clk"); if(!li) return; mL.querySelectorAll("li.clk").forEach(x=>{x.classList.toggle("pick",x===li); x.classList.toggle("x",x!==li);}); $("metricOut").innerHTML="<b>That's the season.</b> One number, checked once a week. Everything else is allowed to be average until it moves."; };
  const eL=$("envList"); if(eL) eL.onclick=e=>{ const li=e.target.closest("li.clk"); if(!li) return; li.classList.toggle("pick"); const n=eL.querySelectorAll(".pick").length; const o=$("envOut"); o.className="verdict"+(n===4?" ok":""); o.innerHTML=n===4?"Forty minutes on Sunday. The whole week's decisions are already made.":n?n+" of 4 in place.":"&nbsp;"; };
  const sR=$("streakRow"); if(sR){ sR.innerHTML=Array.from({length:24},()=>`<button class="sq"></button>`).join(""); const out=$("streakOut");
    sR.onclick=e=>{ const b=e.target.closest(".sq"); if(!b) return; b.classList.toggle("miss"); const sq=[...sR.children]; let dead=false; sq.forEach((el,k)=>{ el.classList.remove("dead"); if(el.classList.contains("miss")&&k&&sq[k-1].classList.contains("miss")){dead=true; el.classList.add("dead"); sq[k-1].classList.add("dead");} });
      const missed=sq.filter(x=>x.classList.contains("miss")).length; out.className="verdict "+(dead?"no":"ok"); out.textContent=dead?"Two in a row. This is the exact moment every plan you've quit actually ended.":missed?`${24-missed} done, ${missed} missed, never twice. Still locked in.`:"Twenty-four sessions. Still locked in."; }; }
}
function wireWeight(){
  drag("gStrHit", t=>{ $("gStrMark").innerHTML=`<circle class="mark" cx="${X(t)}" cy="${Y(Math.min(1,weighted(t)))}" r="7"/>`; const gap=Math.round((weighted(t)-bwOnly(t))*100);
    $("strOut").innerHTML= t<0.22?`<b>Before the belt.</b> Both lines climb — you're getting your first pull-ups.`:`<b>${gap}% stronger</b> than the bodyweight-only version of you at this point, from the same bar and the same time.`; });
  const rR=$("repRow"); if(rR){ rR.innerHTML=Array.from({length:8},()=>`<div class="rep"></div>`).join(""); let n=0; const upd=()=>{ [...rR.children].forEach((el,k)=>el.classList.toggle("hit",k<n)); $("repNote").innerHTML=n<8?`<b>${n} of 8.</b>`:`<b>Eight clean.</b> You've earned the belt — start at ten pounds.`; }; $("repBtn").onclick=()=>{if(n<8)n++;upd();}; $("repReset").onclick=()=>{n=0;upd();}; upd(); }
  drag("gRepHit", t=>{ const pct=t, r=repsFor(pct); $("gRepMark").innerHTML=`<circle class="mark" cx="${X(t)}" cy="${Y(Math.min(1,(r-1)/36))}" r="7"/>`;
    $("repsOut").innerHTML=`<b>${Math.round(pct*100)}% of your max → about ${r} rep${r>1?"s":""}.</b> `+(pct>=0.78?"Strength zone. This is where the belt earns its money.":pct>=0.6?"Muscle zone. Fine, but not what a beginner needs first.":"Endurance. You're practising, not getting stronger."); });
  const lL=$("liftList"); if(lL) lL.onclick=e=>{ const li=e.target.closest("li.clk"); if(!li) return; const sub=li.querySelector("ul"); if(sub){ sub.hidden=!sub.hidden; li.classList.toggle("pick",!sub.hidden);} };
  const wS=$("weekS"), steps=$("gBlockSteps"), tb=document.querySelector("#blockTable tbody");
  if(wS){ const w=k=>k===5?Math.round((10+Math.floor(k/2)*5)/2):10+Math.floor(k/2)*5; const maxL=30;
    if(tb) tb.innerHTML=Array.from({length:8},(_,k)=>`<tr><td class="n">${k+1}</td><td class="n">${w(k)} lb</td><td>${k===5?"3 × 5 · light":"3 × 5 pull · 3 × 6 dip"}</td><td>${k===0?"learn the load":k===5?"deload":k===7?"retest: eight clean at bodyweight?":k%2===0?"add 5 lb":"repeat"}</td></tr>`).join("");
    const upd=()=>{ const cur=+wS.value-1; let d="";
      steps.innerHTML=Array.from({length:8},(_,k)=>{ const x0=X(k/8), x1=X((k+1)/8), y=Y(w(k)/maxL); d+=`${k?"L":"M"}${x0} ${y} L${x1} ${y} `; return `<rect x="${x0+2}" y="${y}" width="${x1-x0-4}" height="${H-PB-y}" fill="${k<=cur?"#B4253A":"#F6F7F8"}" opacity="${k<=cur?".9":"1"}"/><text class="serif small" x="${(x0+x1)/2}" y="${H-PB+18}" text-anchor="middle">${k+1}</text><text class="serif small" x="${(x0+x1)/2}" y="${y-6}" text-anchor="middle">${w(k)}</text>`; }).join("")+`<path class="curve" d="${d}"/>`;
      $("weekV").textContent=cur+1; $("weekLoad").textContent=w(cur)+" lb"; if(tb) [...tb.children].forEach((tr,k)=>tr.classList.toggle("hl",k===cur)); };
    wS.oninput=upd; upd(); }
  const sL=$("stallList"); if(sL) sL.onclick=e=>{ const li=e.target.closest("li.clk"); if(!li) return; const sub=li.querySelector("ul"); if(sub){ sub.hidden=!sub.hidden; li.classList.toggle("pick",!sub.hidden);} };
}
function wireChrist(){
  const wL=$("wrongList"); if(wL) wL.onclick=e=>{ const li=e.target.closest("li.clk"); if(!li) return; li.classList.add("x"); if(wL.querySelectorAll(".x").length===3) $("wrongOut").innerHTML="<b>That's religion. It's not Him.</b> If Christianity were \"try harder\" it would work about as well as every other plan that starts with trying harder — for three weeks."; };
  const vL=$("verseList"); if(vL) vL.onclick=e=>{ const li=e.target.closest("li.clk"); if(!li) return; const sub=li.querySelector("ul"); if(sub){ sub.hidden=!sub.hidden; li.classList.toggle("pick",!sub.hidden);} };
  const tc=$("tgClimb"), tg=$("tgGrace"); if(tc){ const set=grace=>{ tc.setAttribute("aria-pressed",String(!grace)); tg.setAttribute("aria-pressed",String(grace));
      $("gGraceCurve").innerHTML= grace? `<path class="curve" d="M${X(0)} ${Y(0)} L${X(0)} ${Y(1)} L${X(1)} ${Y(1)}"/>${label(0.5,1,"finished — at the start, not the end","middle",-14,"serif small")}${label(0.02,0.5,"the cross","start",0,"serif small")}` : `${path(climb)}${label(0.6,climb(0.6),"trying · earning · hoping","middle",-14,"serif small")}${label(0.98,0.9,"never arrives","end",14,"serif small")}`;
      $("graceCap").textContent= grace? "Him: the line is at \"enough\" from the first day, because He did the climbing. Everything after is living from it, not toward it." : "Religion: you climb toward \"enough\" your whole life and the line never touches it."; };
    tc.onclick=()=>set(false); tg.onclick=()=>set(true); }
  const dR=$("dayRow"); if(dR){ dR.innerHTML=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,k)=>`<button class="day">${d}<b>John ${k+1}</b></button>`).join(""); const out=$("dayOut");
    dR.onclick=e=>{ const b=e.target.closest(".day"); if(!b) return; b.classList.toggle("read"); const n=dR.querySelectorAll(".read").length; out.className="verdict"+(n>=5?" ok":""); out.innerHTML=n===0?"&nbsp;":n===7?"Seven chapters. About seventy minutes. That's the whole first week.":`${n} chapter${n>1?"s":""}. Ten minutes each.`; }; }
}
